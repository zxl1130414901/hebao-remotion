<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>贺报出片台</title>
<style>
  :root{
    --bg:#0E0F12; --panel:#15171C; --line:#262A33; --line2:#1C2028;
    --fg:#E8E6E1; --dim:#8A8F9A; --gold:#D9A441; --ok:#4FAE7A; --bad:#D1584F;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--fg);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; overflow:hidden;
  }
  /* ---------- 左：模板库 ---------- */
  aside{
    width:268px; flex:0 0 268px; height:100%; display:flex; flex-direction:column;
    background:var(--panel); border-right:1px solid var(--line);
  }
  aside .hd{padding:18px 16px 12px;border-bottom:1px solid var(--line2)}
  aside .hd h1{margin:0;font-size:15px;letter-spacing:.06em;font-weight:600}
  aside .hd p{margin:4px 0 0;color:var(--dim);font-size:12px}
  #search{
    width:100%;margin-top:10px;padding:7px 10px;border-radius:7px;
    background:#0B0C0F;border:1px solid var(--line);color:var(--fg);font-size:13px;outline:none;
  }
  #search:focus{border-color:#3A4150}
  #list{overflow-y:auto;padding:8px 8px 24px;flex:1}
  #list::-webkit-scrollbar{width:8px}
  #list::-webkit-scrollbar-thumb{background:#2A2F38;border-radius:4px}
  .grp{margin:10px 8px 4px;font-size:11px;letter-spacing:.14em;color:#6C727E;text-transform:uppercase}
  .item{
    display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;cursor:pointer;
    border:1px solid transparent;color:#C6C9D0;font-size:13px;
  }
  .item:hover{background:#1C2027}
  .item.on{background:#20252E;border-color:#3A4150;color:#fff}
  .item i{font-style:normal;font-size:10px;color:#6C727E;font-variant-numeric:tabular-nums;width:24px}
  .item.on i{color:var(--gold)}
  /* ---------- 右：表单 ---------- */
  main{flex:1;height:100%;display:flex;min-width:0}
  .form{flex:1;min-width:0;overflow-y:auto;padding:22px 26px 90px}
  .form::-webkit-scrollbar{width:10px}
  .form::-webkit-scrollbar-thumb{background:#2A2F38;border-radius:5px}
  .top{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
  .top h2{margin:0;font-size:18px;font-weight:600}
  .top span{color:var(--dim);font-size:12px}
  .hint{color:var(--dim);font-size:12px;margin:0 0 18px}
  fieldset{border:0;padding:0;margin:0 0 18px}
  legend{
    font-size:11px;letter-spacing:.16em;color:#7D8492;text-transform:uppercase;
    padding:0 0 8px;border-bottom:1px solid var(--line2);width:100%;margin-bottom:12px;
  }
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
  .grid.one{grid-template-columns:1fr}
  .f{display:flex;flex-direction:column;gap:4px}
  .f label{font-size:11px;color:#7D8492;letter-spacing:.04em}
  input,textarea,select{
    width:100%;padding:8px 10px;border-radius:7px;background:#0B0C0F;
    border:1px solid var(--line);color:var(--fg);font-size:13px;outline:none;
    font-family:inherit;
  }
  input:focus,textarea:focus,select:focus{border-color:#3A4150;background:#0E1014}
  textarea{resize:vertical;min-height:56px;line-height:1.5}
  .rowline{display:grid;grid-template-columns:1fr 1fr 92px;gap:8px;margin-bottom:8px}
  .msline{display:grid;grid-template-columns:72px 1fr 1fr;gap:8px;margin-bottom:8px}
  .factline{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-bottom:8px}
  .metrics{display:grid;grid-template-columns:100px 92px 1fr 1fr;gap:8px}
  /* ---------- 右：预览 ---------- */
  .side{
    width:392px;flex:0 0 392px;border-left:1px solid var(--line);background:var(--panel);
    display:flex;flex-direction:column;padding:18px;gap:14px;
  }
  .stage{
    aspect-ratio:9/16;width:100%;border-radius:10px;background:#08090B;
    border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;
  }
  .stage video{width:100%;height:100%;object-fit:contain;background:#000}
  .stage .ph{color:#565C66;font-size:12px;text-align:center;line-height:1.9;padding:0 20px}
  .bar{height:4px;border-radius:2px;background:#22262E;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#B8862F,#E8C071);transition:width .3s}
  .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .acts{display:flex;gap:8px}
  button{
    flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#1C2027;
    color:var(--fg);font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;
  }
  button:hover{background:#232832}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:linear-gradient(180deg,#E0B25A,#C08E2E);color:#14100A;border:0;font-weight:600}
  button.primary:hover{filter:brightness(1.06)}
  .name{display:flex;flex-direction:column;gap:4px}
  .name label{font-size:11px;color:#7D8492}
  .foot{font-size:11px;color:#5F6570;line-height:1.7}
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:#20252E;border:1px solid #3A4150;color:#E8E6E1;padding:9px 16px;border-radius:8px;
    font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:9;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.bad{border-color:#6A322C;color:#F0A9A2}
</style>
</head>
<body>
<aside>
  <div class="hd">
    <h1>贺报出片台</h1>
    <p>选模板 → 填内容 → 出片。单支约 30 秒。</p>
    <input id="search" placeholder="搜模板名，如「金线」「星榜」" />
  </div>
  <div id="list"></div>
</aside>

<main>
  <div class="form" id="form">
    <div class="top"><h2 id="tname">—</h2><span id="tmeta"></span></div>
    <p class="hint">这里改的是<b>这一支的内容</b>，不会影响其它模板，也不会触发全量重渲。留空的字段会用模板原值。</p>

    <fieldset data-uses="hero portrait metric list story">
      <legend>基本信息</legend>
      <div class="grid">
        <div class="f"><label>机构 / 品牌</label><input data-k="brand" /></div>
        <div class="f"><label>眉标（大会名 · 城市）</label><input data-k="kicker" /></div>
        <div class="f"><label>主标题（2–8 字最佳）</label><input data-k="title" /></div>
        <div class="f"><label>副标题</label><input data-k="subtitle" /></div>
        <div class="f"><label>受贺人 / 主体</label><input data-k="honoree" /></div>
        <div class="f"><label>身份 / 职务</label><input data-k="role" /></div>
        <div class="f"><label>奖项 / 事件</label><input data-k="award" /></div>
        <div class="f"><label>日期 / 届次</label><input data-k="dateText" /></div>
      </div>
    </fieldset>

    <fieldset data-uses="hero portrait metric">
      <legend>核心数字</legend>
      <div class="metrics">
        <div class="f"><label>数值</label><input data-k="metric.value" type="number" step="any" /></div>
        <div class="f"><label>小数位</label>
          <select data-k="metric.decimals"><option value="0">0</option><option value="1">1</option><option value="2">2</option></select>
        </div>
        <div class="f"><label>单位（亿 / 人 / 篇）</label><input data-k="metric.unit" /></div>
        <div class="f"><label>说明（数字下方）</label><input data-k="metric.label" /></div>
      </div>
    </fieldset>

    <fieldset data-uses="portrait metric">
      <legend>三项事实</legend>
      <div id="facts"></div>
    </fieldset>

    <fieldset data-uses="list">
      <legend>榜单 / 名单（第一行为冠军）</legend>
      <div id="rows"></div>
    </fieldset>

    <fieldset data-uses="story">
      <legend>三段历程</legend>
      <div id="ms"></div>
    </fieldset>

    <fieldset data-uses="hero portrait metric list story">
      <legend>金句与口径</legend>
      <div class="grid one">
        <div class="f"><label>金句 / 评语</label><textarea data-k="quote" rows="2"></textarea></div>
        <div class="f"><label>底部小字（合规 / 口径）</label><textarea data-k="footnote" rows="2"></textarea></div>
      </div>
    </fieldset>
  </div>

  <div class="side">
    <div class="name">
      <label>成片文件名</label>
      <input id="fname" placeholder="例：张三_晋升贺报" />
    </div>
    <div class="stage" id="stage">
      <div class="ph">这里显示刚刚生成的成片<br />改完文案点「生成视频」即可</div>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="meta"><span id="pstat">待生成</span><span id="ptime"></span></div>
    <div class="acts">
      <button class="primary" id="go">生成视频</button>
      <button id="save" title="把当前填写写成该模板的默认文案">存为模板文案</button>
    </div>
    <p class="foot">
      只渲染你当前选中的这一支：改文案 → 30 秒出片，其余 64 支不动。<br />
      成片保存在项目 <code>studio-out/</code> 目录。
    </p>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const LAYOUT_CN = { hero:'巨字', portrait:'人物', metric:'数字', list:'榜单', story:'历程' };
let TPLS = [], CUR = null, values = {}, polling = null;

const $ = (s) => document.querySelector(s);
const toast = (m, bad) => {
  const t = $('#toast'); t.textContent = m; t.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(t._h); t._h = setTimeout(() => (t.className = 'toast'), 2600);
};

const getPath = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
const setPath = (o, p, v) => {
  const ks = p.split('.'); let t = o;
  for (let i = 0; i < ks.length - 1; i++) { t[ks[i]] = t[ks[i]] || {}; t = t[ks[i]]; }
  t[ks[ks.length - 1]] = v;
};

async function boot() {
  const r = await fetch('/api/templates').then((x) => x.json());
  TPLS = r.templates;
  renderList();
  /* 支持 ?id=u04 直接定位某支，方便发给同事"就改这一支" */
  const want = new URLSearchParams(location.search).get('id');
  select(TPLS.some((t) => t.id === want) ? want : TPLS[0].id);
}

function renderList() {
  const q = $('#search').value.trim();
  const box = $('#list'); box.innerHTML = '';
  const groups = [];
  for (const t of TPLS) {
    const g = t.name.split('·')[0];
    let hit = groups.find((x) => x.g === g);
    if (!hit) { hit = { g, items: [] }; groups.push(hit); }
    hit.items.push(t);
  }
  for (const grp of groups) {
    const items = grp.items.filter((t) => !q || t.name.includes(q) || t.id.includes(q));
    if (!items.length) continue;
    const h = document.createElement('div'); h.className = 'grp'; h.textContent = grp.g; box.appendChild(h);
    for (const t of items) {
      const d = document.createElement('div');
      d.className = 'item' + (CUR && CUR.id === t.id ? ' on' : '');
      d.innerHTML = `<i>${t.id}</i><span>${t.name.split('·')[1] || t.name}</span>`;
      d.onclick = () => select(t.id);
      box.appendChild(d);
    }
  }
}

function select(id) {
  CUR = TPLS.find((t) => t.id === id);
  values = JSON.parse(JSON.stringify(CUR.values || {}));
  $('#tname').textContent = CUR.name;
  $('#tmeta').textContent = `${CUR.id} · ${CUR.skin} · ${LAYOUT_CN[CUR.layout] || CUR.layout}`;
  $('#fname').value = `${CUR.name.replace(/·/g, '-')}_${CUR.id}`;
  document.querySelectorAll('fieldset').forEach((fs) => {
    const uses = (fs.dataset.uses || '').split(' ');
    fs.style.display = uses.includes(CUR.layout) ? '' : 'none';
  });
  document.querySelectorAll('[data-k]').forEach((el) => {
    const v = getPath(values, el.dataset.k);
    el.value = v == null ? '' : v;
  });
  buildFacts(); buildRows(); buildMs();
  renderList();
  $('#prog').style.width = '0%';
  $('#pstat').textContent = '待生成';
  $('#ptime').textContent = '';
}

function buildFacts() {
  const box = $('#facts'); box.innerHTML = '';
  const arr = values.facts && values.facts.length ? values.facts : [{k:'',v:''},{k:'',v:''},{k:'',v:''}];
  for (let i = 0; i < 3; i++) {
    const d = document.createElement('div'); d.className = 'factline';
    d.innerHTML = `<input placeholder="标签" value="${(arr[i]?.k||'').replace(/"/g,'&quot;')}" data-f="k${i}" />
                   <input placeholder="值" value="${(arr[i]?.v||'').replace(/"/g,'&quot;')}" data-f="v${i}" />`;
    box.appendChild(d);
  }
}

function buildRows() {
  const box = $('#rows'); box.innerHTML = '';
  const arr = values.rows && values.rows.length ? values.rows : [{name:'',role:'',value:''}];
  for (let i = 0; i < Math.min(5, Math.max(1, arr.length)); i++) {
    const r = arr[i] || {};
    const d = document.createElement('div'); d.className = 'rowline';
    d.innerHTML = `<input placeholder="名称" value="${(r.name||'').replace(/"/g,'&quot;')}" data-r="name${i}" />
                   <input placeholder="角色 / 大区" value="${(r.role||'').replace(/"/g,'&quot;')}" data-r="role${i}" />
                   <input placeholder="数值" value="${(r.value||'').replace(/"/g,'&quot;')}" data-r="value${i}" />`;
    box.appendChild(d);
  }
}

function buildMs() {
  const box = $('#ms'); box.innerHTML = '';
  const arr = values.milestones && values.milestones.length ? values.milestones : [{t:'',label:'',note:''}];
  for (let i = 0; i < Math.min(3, Math.max(1, arr.length)); i++) {
    const m = arr[i] || {};
    const d = document.createElement('div'); d.className = 'msline';
    d.innerHTML = `<input placeholder="D1 日期" value="${(m.t||'').replace(/"/g,'&quot;')}" data-m="t${i}" />
                   <input placeholder="节点" value="${(m.label||'').replace(/"/g,'&quot;')}" data-m="label${i}" />
                   <input placeholder="说明" value="${(m.note||'').replace(/"/g,'&quot;')}" data-m="note${i}" />`;
    box.appendChild(d);
  }
}

function collect() {
  const out = JSON.parse(JSON.stringify(values));
  document.querySelectorAll('[data-k]').forEach((el) => {
    let v = el.value;
    if (el.dataset.k === 'metric.value') v = Number(v || 0);
    if (el.dataset.k === 'metric.decimals') v = Number(v || 0);
    setPath(out, el.dataset.k, v);
  });
  out.facts = [0,1,2].map((i) => ({
    k: ($(`[data-f="k${i}"]`) || {}).value || '',
    v: ($(`[data-f="v${i}"]`) || {}).value || '',
  })).filter((f) => f.k || f.v);
  const rc = document.querySelectorAll('[data-r="name0"]').length;
  out.rows = [];
  for (let i = 0; i < rc; i++) {
    out.rows.push({
      name: $(`[data-r="name${i}"]`).value,
      role: $(`[data-r="role${i}"]`).value,
      value: $(`[data-r="value${i}"]`).value,
    });
  }
  const mc = document.querySelectorAll('[data-m="t0"]').length;
  out.milestones = [];
  for (let i = 0; i < mc; i++) {
    out.milestones.push({
      t: $(`[data-m="t${i}"]`).value,
      label: $(`[data-m="label${i}"]`).value,
      note: $(`[data-m="note${i}"]`).value,
    });
  }
  return out;
}

async function render() {
  if (!CUR) return;
  const btn = $('#go');
  btn.disabled = true; btn.textContent = '生成中…';
  $('#pstat').textContent = '排队中';
  $('#prog').style.width = '0%';
  try {
    const r = await fetch('/api/render', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: CUR.id, filename: $('#fname').value, props: collect() }),
    }).then((x) => x.json());
    if (!r.ok) throw new Error(r.error || '提交失败');
    poll(r.jobId);
  } catch (e) {
    toast(e.message, true);
    btn.disabled = false; btn.textContent = '生成视频';
    $('#pstat').textContent = '失败';
  }
}

function poll(jobId) {
  clearInterval(polling);
  polling = setInterval(async () => {
    const j = await fetch('/api/job/' + jobId).then((x) => x.json());
    if (!j.ok) return;
    if (j.status === 'rendering' || j.status === 'queued') {
      const pct = Math.round((j.progress || 0) * 100);
      $('#prog').style.width = pct + '%';
      $('#pstat').textContent = j.status === 'queued' ? '排队中' : `生成中 ${pct}%`;
      $('#ptime').textContent = `${j.frames || 0} / 482 帧`;
    } else if (j.status === 'done') {
      clearInterval(polling);
      $('#prog').style.width = '100%';
      $('#pstat').textContent = '已完成';
      $('#ptime').textContent = j.seconds ? j.seconds + ' 秒' : '';
      $('#stage').innerHTML = `<video src="/files/${encodeURIComponent(j.file)}" controls autoplay loop playsinline></video>`;
      const btn = $('#go'); btn.disabled = false; btn.textContent = '重新生成';
      toast('出片完成：' + j.file);
    } else if (j.status === 'error') {
      clearInterval(polling);
      $('#pstat').textContent = '失败';
      $('#prog').style.width = '0%';
      const btn = $('#go'); btn.disabled = false; btn.textContent = '生成视频';
      toast(j.error || '渲染失败', true);
    }
  }, 700);
}

$('#go').onclick = render;
$('#search').oninput = renderList;
$('#save').onclick = async () => {
  const r = await fetch('/api/save', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: CUR.id, props: collect() }),
  }).then((x) => x.json());
  toast(r.ok ? '已存为该模板的默认文案（content/demo.json）' : r.error, !r.ok);
};
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); if (!$('#go').disabled) render(); }
});

boot();
</script>
</body>
</html>
